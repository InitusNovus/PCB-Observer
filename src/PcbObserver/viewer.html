<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KiCad Observer · Phase 1</title>
<style>
  html,body{margin:0;height:100%;background:#151a20;color:#e5edf5;font:14px system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  header{padding:8px 14px;display:flex;align-items:center;gap:12px;background:#222b36;flex-wrap:wrap}
  header strong{margin-right:auto}
  button,select{background:#344354;color:inherit;border:1px solid #62758a;border-radius:5px;padding:5px 9px;cursor:pointer}
  button.active{background:#4b6b8f;border-color:#7fa3d1}
  #badge{padding:5px 10px;border-radius:5px;background:#1d3a26;border:1px solid #2f6f45;font-weight:600;white-space:nowrap}
  #badge.hold{background:#3a331d;border-color:#6f5f2f}
  #badge.error{background:#3a1d1d;border-color:#6f2f2f}
  #badge.history{background:#2a2333;border-color:#57456f}
  #layers{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:46vw}
  #layers label{display:flex;gap:4px;align-items:center;color:#a7b7c8;cursor:pointer;font-size:13px}
  #viewport{flex:1;overflow:hidden;position:relative;cursor:grab;touch-action:none}
  #viewport:active{cursor:grabbing}
  #stack{position:absolute;left:50%;top:50%;width:min(85vw,1100px);transform-origin:center center;pointer-events:none;user-select:none}
  #stack img{position:absolute;left:0;top:0;width:100%;max-width:none;display:none}
  #stack img.on{display:block}
  footer{padding:6px 14px;color:#a7b7c8;background:#222b36;display:flex;gap:18px;flex-wrap:wrap}
  #history{position:absolute;right:10px;top:10px;background:#222b36ee;border:1px solid #62758a;border-radius:6px;padding:8px;max-height:70%;overflow:auto;display:none;z-index:5}
  #history button{display:block;width:100%;margin:3px 0;text-align:left}
  #history button.current{background:#4b6b8f;border-color:#7fa3d1}
  #history .meta{color:#8fa2b5;font-size:12px;margin-left:6px}
  #notice{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#5a2d2d;border-radius:6px;padding:6px 12px;display:none;z-index:6}
  #searchBox{position:relative}
  #searchBox input{background:#151a20;color:inherit;border:1px solid #62758a;border-radius:5px;padding:5px 9px;width:120px}
  #searchResults{position:absolute;top:110%;left:0;background:#222b36ee;border:1px solid #62758a;border-radius:6px;padding:6px;max-height:60vh;overflow:auto;display:none;z-index:7;min-width:180px}
  #searchResults button{display:block;width:100%;margin:2px 0;text-align:left}
  #searchResults .meta{color:#8fa2b5;font-size:12px;margin-left:6px}
  #searchRing{position:absolute;left:50%;top:50%;width:80px;height:80px;border:3px solid #7fa3d1;border-radius:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;z-index:4;opacity:.9;transition:opacity .8s}
</style>
<header>
  <strong>KiCad Observer</strong>
  <span id="badge">connecting…</span>
  <button id="hold">HOLD</button>
  <button id="latest" title="Return to newest completed render">Latest</button>
  <button id="historyBtn">HISTORY</button>
  <span id="layers"></span>
  <span id="searchBox"><input id="search" type="text" placeholder="RefDes (U103)" autocomplete="off" spellcheck="false"><div id="searchResults"></div></span>
  <button id="side">Back</button>
  <button id="fit">Reset view</button>
</header>
<div id="viewport">
  <div id="stack"><div id="searchRing"></div></div>
  <div id="history"></div>
  <div id="notice"></div>
</div>
<footer><span id="f-source">—</span><span id="f-captured">—</span><span id="f-render">—</span><span>LIVE via SSE · observer only · source never modified</span></footer>
<script>
'use strict';
const COPPER=['F.Cu','B.Cu'];
const OVERLAYS=[
  ['Edge.Cuts','Edge',true],['F.Silkscreen','F.Silk',true],['B.Silkscreen','B.Silk',true],
  ['F.Mask','F.Mask',false],['B.Mask','B.Mask',false],['F.Paste','F.Paste',false],
  ['B.Paste','B.Paste',false],['F.Fab','F.Fab',false],['B.Fab','B.Fab',false],
  ['Cmts.User','Cmts',false]];
const LAYERS=[...COPPER,...OVERLAYS.map(o=>o[0])];
const stack=document.querySelector('#stack'),viewport=document.querySelector('#viewport');
const badge=document.querySelector('#badge'),notice=document.querySelector('#notice');
const historyPanel=document.querySelector('#history'),layersBox=document.querySelector('#layers');

const imgs={};for(const name of LAYERS){const img=document.createElement('img');img.alt=name;img.onerror=()=>assetMissing(name);stack.append(img);imgs[name]=img}

// ---- persisted view state (survives browser reopen; AT-012 feedback) ----
const STORE_KEY='pcbobs-view';
const DEFAULT_VIEW={zoom:1,x:0,y:0,back:false,cu:'F.Cu',ov:{}};
OVERLAYS.forEach(([n,,d])=>DEFAULT_VIEW.ov[n]=d);
let view;
try{view=Object.assign({},DEFAULT_VIEW,JSON.parse(localStorage.getItem(STORE_KEY)||'{}'));
    view.ov=Object.assign({},DEFAULT_VIEW.ov,view.ov||{});
    if(!COPPER.includes(view.cu))view.cu='F.Cu';}
catch(e){view=JSON.parse(JSON.stringify(DEFAULT_VIEW))}
function saveView(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify({zoom:view.zoom,x:view.x,y:view.y,back:view.back,cu:view.cu,ov:view.ov}))}catch(e){}
}

let displayed=0,liveSeq=0,hold=false,historyMode=false;
let lastSource='—',lastCaptured=null,lastRender=null,lastError=null;

// Board centered at the viewport origin (feedback: initial view off-center).
function applyView(){
  const sx=view.back?-view.zoom:view.zoom;
  stack.style.transform=`translate(-50%,-50%) translate(${view.x}px,${view.y}px) scale(${sx},${view.zoom})`;
}
function noticeFor(sec){notice.textContent=sec;notice.style.display='block';setTimeout(()=>notice.style.display='none',4000)}

// ---- layer UI (12 layers: copper radio + overlay checkboxes) ----
function buildLayerUI(){
  layersBox.textContent='';
  for(const cu of COPPER){
    const l=document.createElement('label');
    const r=document.createElement('input');r.type='radio';r.name='cu';r.value=cu;r.checked=view.cu===cu;
    r.onchange=()=>{view.cu=cu;applyLayerVisibility();saveView()};
    l.append(r);l.append(cu);layersBox.append(l);
  }
  for(const [name,label] of OVERLAYS){
    const l=document.createElement('label');
    const c=document.createElement('input');c.type='checkbox';c.checked=!!view.ov[name];
    c.onchange=()=>{view.ov[name]=c.checked;applyLayerVisibility();saveView()};
    l.append(c);l.append(label);layersBox.append(l);
  }
}
function applyLayerVisibility(){
  for(const name of LAYERS){
    let on;
    if(COPPER.includes(name))on=name===view.cu;
    else on=!!view.ov[name];
    imgs[name].classList.toggle('on',on);
  }
}

// FR-008/AT-005: one-tick bundle switch — every visible layer's src swaps
// together. The layer set comes from the bundle's self-describing manifest,
// so --layers subset bundles never request files that do not exist (run-2
// review: hardcoded 12-layer requests 404-looped on subset bundles).
let manifestLayers=[],manifestRequest=0;
async function showSeq(seq){
  const request=++manifestRequest;
  displayed=seq;
  let nextLayers=[];
  try{
    const m=await fetch(`/renders/${seq}/manifest.json`).then(r=>r.ok?r.json():null);
    nextLayers=m&&Array.isArray(m.layers)?m.layers:[];
  }catch(e){nextLayers=[]}
  if(request!==manifestRequest)return;
  manifestLayers=nextLayers;
  for(const name of LAYERS){
    const img=imgs[name];
    img.onerror=null;
    img.removeAttribute('src');
  }
  const wanted=LAYERS.filter(n=>manifestLayers.includes(n));
  for(const name of wanted){
    imgs[name].src=`/renders/${seq}/${encodeURIComponent(name)}.svg`;
  }
  for(const name of wanted){
    imgs[name].onerror=()=>assetMissing(name);
  }
  buildRefdesIndex(seq);
  renderBadge();
}

// §23 RefDes search: index <text> nodes (reference + x/y) from the
// displayed bundle's silk SVG; kicad-cli keeps invisible text anchors
// (measured: C104 x="46.2190" y="6.0360" in F.Silkscreen.svg).
const refdesIndex=new Map(); // seq -> {items:[{ref,fx,fy}], reason?:string}
async function buildRefdesIndex(seq){
  if(refdesIndex.has(seq))return;
  refdesIndex.set(seq,{items:[]});
  const layers=['F.Silkscreen','B.Silkscreen','F.Fab','B.Fab'].filter(n=>manifestLayers.includes(n));
  for(const layer of layers){
    try{
      const text=await fetch(`/renders/${seq}/${encodeURIComponent(layer)}.svg`).then(r=>r.ok?r.text():null);
      if(!text)continue;
      const doc=new DOMParser().parseFromString(text,'image/svg+xml');
      const svg=doc.documentElement;
      const vb=(svg.getAttribute('viewBox')||'0 0 1 1').split(/[\s,]+/).map(Number);
      const vbW=vb[2]||1,vbH=vb[3]||1;
      const items=[...svg.querySelectorAll('text')]
        .map(t=>({ref:(t.textContent||'').trim(),x:parseFloat(t.getAttribute('x')),y:parseFloat(t.getAttribute('y'))}))
        .filter(it=>/^[A-Za-z]{1,4}[0-9]+/.test(it.ref)&&isFinite(it.x)&&isFinite(it.y))
        .map(it=>({ref:it.ref,fx:it.x/vbW,fy:it.y/vbH}));
      if(items.length){
        refdesIndex.set(seq,{items});
        if(document.activeElement===searchInput)renderSearch();
        return;
      }
    }catch(e){}
  }
  refdesIndex.set(seq,{items:[],reason:'검색 불가(색인 없음 — 텍스트 앵커가 없는 번들)'});
  if(document.activeElement===searchInput)renderSearch();
}

const searchInput=document.querySelector('#search');
const searchResults=document.querySelector('#searchResults');
const searchRing=document.querySelector('#searchRing');
let ringTimer=null;
function showRing(fx,fy){
  searchRing.style.left=(fx*100)+'%';
  searchRing.style.top=(fy*100)+'%';
  searchRing.style.display='block';
  searchRing.style.opacity='.9';
  if(ringTimer)clearTimeout(ringTimer);
  ringTimer=setTimeout(()=>{searchRing.style.opacity='0'},1200);
}
function gotoRefdes(item){
  // SVG coords -> stack-local fraction -> pan so the part lands centered.
  // offsetWidth/Height are the untransformed layout size the transform
  // scales from, so the math stays exact at any zoom.
  const stack=document.querySelector('#stack');
  const z=view.zoom||1;
  const px=(item.fx-0.5)*stack.offsetWidth, py=(item.fy-0.5)*stack.offsetHeight;
  view.x=-z*px; view.y=-z*py;
  applyView();saveView();
  showRing(item.fx,item.fy);
}
function renderSearch(){
  const idx=refdesIndex.get(displayed);
  searchResults.textContent='';
  const note=t=>{const d=document.createElement('div');d.className='meta';d.textContent=t;searchResults.append(d);searchResults.style.display='block'};
  if(!idx){note('색인 구축 중…');return}
  const q=searchInput.value.trim().toLowerCase();
  if(!q){searchResults.style.display='none';return}
  if(idx.reason){note(idx.reason);return}
  const matches=idx.items.filter(it=>it.ref.toLowerCase().startsWith(q)).slice(0,50);
  if(!matches.length){note('매칭 없음');return}
  for(const m of matches){
    const b=document.createElement('button');
    const main=document.createElement('span');main.textContent=m.ref;
    const meta=document.createElement('span');meta.className='meta';
    meta.textContent=`${(m.fx*100).toFixed(0)},${(m.fy*100).toFixed(0)}%`;
    b.append(main,meta);
    b.onclick=()=>{searchResults.style.display='none';gotoRefdes(m)};
    searchResults.append(b);
  }
  searchResults.style.display='block';
}
searchInput.addEventListener('input',renderSearch);
searchInput.addEventListener('focus',renderSearch);
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';searchResults.style.display='none';searchInput.blur()}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#searchBox'))searchResults.style.display='none'},true);
function assetMissing(){
  noticeFor('번들이 정리되었습니다 — 최신으로 이동합니다');
  if(displayed===liveSeq)goLatest();
}
function setBadge(text,cls){badge.textContent=text;badge.className=cls}
function renderBadge(){
  if(!liveSeq){setBadge('connecting…','');return}
  if(displayed!==liveSeq&&historyMode){setBadge(`HISTORY · displaying #${displayed} · latest #${liveSeq}`,'history')}
  else if(displayed!==liveSeq&&hold){setBadge(`HOLD · displaying #${displayed} · latest #${liveSeq}`,'hold')}
  else if(displayed!==liveSeq){setBadge(`HISTORY · displaying #${displayed} · latest #${liveSeq}`,'history')}
  else if(lastError&&(!lastRender||lastError.sequence>lastRender.sequence)){
    setBadge(`Displaying #${displayed} · render failed · will update on next save`,'error')}
  else if(lastRender&&lastCaptured&&lastCaptured.sequence>lastRender.sequence){
    setBadge(`LIVE · displaying #${lastRender.sequence} · rendering #${lastCaptured.sequence}…`,'')}
  else if(lastSource&&lastSource.includes('waiting')){setBadge('Source changed · waiting stable…','')}
  else if(lastSource&&lastSource.includes('unstable')){setBadge('Source changed · waiting stable…','')}
  else{setBadge(`LIVE · #${liveSeq}`,'')}
  document.querySelector('#f-source').textContent=`source: ${lastSource}`;
  document.querySelector('#f-captured').textContent=lastCaptured?`captured: #${lastCaptured.sequence} ${new Date(lastCaptured.captured_at).toLocaleTimeString()}`:'captured: —';
  document.querySelector('#f-render').textContent=lastRender?`render: #${lastRender.sequence} ${new Date(lastRender.created_at).toLocaleTimeString()}`:'render: —';
}
function refreshFromState(){
  fetch('/api/state').then(r=>r.json()).then(s=>{
    lastSource=s.source_last_event;lastCaptured=s.latest_captured_snapshot;lastRender=s.latest_completed_render;lastError=s.last_error;
    if(s.latest_completed_render)liveSeq=s.latest_completed_render.sequence;
    if(!hold&&!historyMode&&liveSeq&&displayed!==liveSeq)showSeq(liveSeq);else renderBadge();
  });
}
// A9: subscribe FIRST, then fetch state — never miss a publish between the two.
const es=new EventSource('/api/events');
es.addEventListener('state',refreshFromState);
es.addEventListener('bundle',refreshFromState);
es.onopen=refreshFromState;
refreshFromState();

document.querySelector('#hold').onclick=e=>{
  hold=!hold;
  e.target.textContent=hold?'HOLD ✓':'HOLD';
  e.target.classList.toggle('active',hold);
  renderBadge();
};
function goLatest(){
  hold=false;
  historyMode=false;
  const h=document.querySelector('#hold');h.textContent='HOLD';h.classList.remove('active');
  historyPanel.style.display='none';
  if(liveSeq)showSeq(liveSeq);
  else manifestRequest++;
}
document.querySelector('#latest').onclick=goLatest;
document.querySelector('#historyBtn').onclick=async()=>{
  if(historyPanel.style.display==='block'){historyPanel.style.display='none';return}
  const rows=await fetch('/api/snapshots').then(r=>r.json());
  historyPanel.textContent='';
  // A4: only snapshots whose render completed; rows carry hash+time so
  // identical-content bundles are distinguishable (AT-014 feedback).
  for(const row of rows.filter(r=>r.render_status==='complete')){
    const b=document.createElement('button');
    const main=document.createElement('span');
    main.textContent=`#${row.sequence}`;
    const meta=document.createElement('span');
    meta.className='meta';
    meta.textContent=`${row.content_hash.slice(0,8)} · ${new Date(row.captured_at).toLocaleTimeString()}`;
    b.append(main);b.append(meta);
    if(row.sequence===displayed)b.classList.add('current');
    b.onclick=()=>{historyPanel.style.display='none';historyMode=true;showSeq(row.sequence)};
    historyPanel.append(b);
  }
  historyPanel.style.display='block';
};

function isInteractiveTarget(target){
  return target instanceof Element&&!!target.closest('#history,button,select,input,textarea,a,label,[role="button"]');
}
viewport.addEventListener('wheel',e=>{
  if(isInteractiveTarget(e.target))return;
  e.preventDefault();
  view.zoom=Math.max(.2,Math.min(20,view.zoom*(e.deltaY<0?1.15:1/1.15)));
  applyView();saveView()
},{passive:false});
let drag=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0||isInteractiveTarget(e.target))return;
  drag=[e.clientX-view.x,e.clientY-view.y];
  viewport.setPointerCapture(e.pointerId)
});
viewport.addEventListener('pointermove',e=>{if(drag){view.x=e.clientX-drag[0];view.y=e.clientY-drag[1];applyView()}});
viewport.addEventListener('pointerup',()=>{drag=null;saveView()});
viewport.addEventListener('pointercancel',()=>drag=null);
document.querySelector('#fit').onclick=()=>{
  view.zoom=1;view.x=0;view.y=0;
  applyView();saveView();
};
document.querySelector('#side').onclick=e=>{view.back=!view.back;e.target.textContent=view.back?'Back ✓':'Back';applyView();saveView()};
buildLayerUI();applyLayerVisibility();applyView();
</script>
</html>
